<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="4;url=https://the-joint-thesis.github.io/Apex-Security/index.html">
    <title>Redirecting...</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.17/index.min.css">
    <style>
        :root {
            --primary: #050505;
            --accent: #3366ff;
            --secondary: #06b6d4;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--primary);
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(51, 102, 255, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: breathe 4s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }
        .redirect-container {
            text-align: center;
            z-index: 1;
            padding: 2rem;
            max-width: 90%;
        }
        .emoji-wrap {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(51, 102, 255, 0.5));
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        .redirect-text {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 0.8rem;
            background: linear-gradient(90deg, var(--accent), var(--secondary), var(--accent));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 3s linear infinite;
        }
        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .redirect-subtext {
            color: rgba(255,255,255,0.6);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .loader-track {
            width: 100%;
            max-width: 300px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin: 0 auto 1.5rem;
            overflow: hidden;
        }
        .loader-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--secondary));
            border-radius: 4px;
            box-shadow: 0 0 10px var(--accent);
        }
        .manual-link {
            display: inline-block;
            padding: 0.9rem 2rem;
            background: transparent;
            border: 1px solid rgba(51, 102, 255, 0.5);
            color: var(--accent);
            text-decoration: none;
            border-radius: 12px;
            transition: var(--transition);
            font-weight: 500;
            font-size: 0.95rem;
            backdrop-filter: blur(5px);
        }
        .manual-link:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(51, 102, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="redirect-container">
        <div class="emoji-wrap">🚀</div>
        <h1 class="redirect-text">Redirecting to New Home</h1>
        <p class="redirect-subtext">✨ We've upgraded our project! Taking you to the new site in a moment...</p>
        <div class="loader-track">
            <div class="loader-bar" id="loader-bar"></div>
        </div>
        <a href="https://the-joint-thesis.github.io/Apex-Security/index.html" class="manual-link">Click here if not redirected</a>
    </div>
    <script>
        const NEW_URL = 'https://the-joint-thesis.github.io/Apex-Security/index.html';
        const redirectDelay = 3500;
        const loaderBar = document.getElementById('loader-bar');
        let progress = 0;
        
        const interval = setInterval(() => {
            progress += (100 / (redirectDelay / 20));
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
            }
            loaderBar.style.width = `${progress}%`;
        }, 20);

        setTimeout(() => {
            window.location.replace(NEW_URL);
        }, redirectDelay);
    </script>
</body>
</html>
